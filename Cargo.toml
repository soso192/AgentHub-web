[package]
name = "cc-web"
version = "1.0.0"
edition = "2021"
description = "Claude Code Web Interface - A web-based UI for Claude Code CLI"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
mime_guess = "2"
dirs = "5"
encoding_rs = "0.8"
async-stream = "0.3"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
