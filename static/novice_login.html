<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="CC-Web 小白版登录页">
<title>登录 - 智能开发</title>
<link rel="stylesheet" href="/style.css">
<style>
/* 登录页（卡片样式与主界面登录页保持一致） */
body { margin: 0; }
.nv-login-page {
    position: fixed; inset: 0; padding: 24px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background:
        radial-gradient(circle at 15% 15%, rgba(43,108,246,.14), transparent 42%),
        radial-gradient(circle at 85% 85%, rgba(43,108,246,.10), transparent 42%),
        var(--bg, #f0f2f5);
    color: var(--text, #1f2329);
}
.nv-login-brand { text-align: center; font-size: 26px; font-weight: 700; color: var(--accent, #2b6cf6); line-height: 1.25; }
.nv-login-brand small { display: block; font-size: 13px; font-weight: 400; color: var(--text-secondary, #8a9099); margin-top: 6px; }
.nv-login-box {
    background: var(--card, #fff); color: var(--text, #1f2329);
    border-radius: 14px; padding: 34px 32px; width: 360px; max-width: 100%; box-sizing: border-box;
    border: 1px solid var(--border, #e5e7eb); box-shadow: 0 14px 44px rgba(0,0,0,.10);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}
.nv-login-box h2 { margin: 0 0 18px; text-align: center; font-size: 18px; }
.nv-login-box input { width: 100%; padding: 9px 11px; margin-bottom: 12px; border: 1px solid var(--border, #e0e4e9); border-radius: 8px; font-size: 14px; box-sizing: border-box; background: var(--card, #fff); color: inherit; }
.nv-login-msg { min-height: 18px; font-size: 12.5px; color: #d84a3f; margin-bottom: 6px; }
.nv-primary-btn { width: 100%; padding: 9px 14px; border: 0; border-radius: 8px; background: #2b6cf6; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
.nv-primary-btn:hover { opacity: .92; }
.nv-primary-btn:disabled { opacity: .6; cursor: default; }
</style>
<script>
// 登录页也跟随主题（与主界面共用 cc-web-theme）
(function () {
    try {
        var theme = localStorage.getItem('cc-web-theme');
        if (theme) document.documentElement.dataset.theme = theme;
    } catch (e) {}
})();
</script>
</head>
<body>
<div class="nv-login-page">
    <div class="nv-login-brand">智能开发<small>AI帮你解决问题</small></div>
    <div class="nv-login-box">
        <h2>账号登录</h2>
        <input type="text" id="patchLoginUsername" placeholder="用户名" autocomplete="username">
        <input type="password" id="patchLoginPassword" placeholder="密码" autocomplete="current-password">
        <div class="nv-login-msg" id="patchLoginMessage"></div>
        <button class="nv-primary-btn" id="btn-login" type="button">登 录</button>
    </div>
</div>
<script src="/common.js"></script>
<script src="/novice_login.js"></script>
</body>
</html>
