<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC-Web - AI Coding Assistant Hub</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Sessions</h2>
                <button id="newSessionBtn" title="New Session">+</button>
            </div>
            <div id="newSessionForm" class="new-session-form" style="display:none;">
                <div class="form-group">
                    <label>AI Assistant</label>
                    <select id="assistantSelect" class="form-select">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Working Directory</label>
                    <input type="text" id="cwdInput" placeholder="e.g., C:/Users/you/project">
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <select id="modelSelectNew" class="form-select">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-buttons">
                    <button id="createSessionBtn">Create</button>
                    <button id="cancelSessionBtn">Cancel</button>
                </div>
            </div>
            <div id="sessionList" class="session-list"></div>

            <!-- File Browser -->
            <div id="fileBrowser" class="file-browser">
                <div class="file-browser-header" onclick="toggleFileBrowser()">
                    <span class="file-browser-icon">📁</span>
                    <span class="file-browser-title">Files</span>
                    <span id="fileBrowserPath" class="file-browser-path"></span>
                    <span id="fileBrowserToggle" class="file-browser-toggle">▶</span>
                </div>
                <div id="fileBrowserContent" class="file-browser-content" style="display:none;">
                    <div id="fileList" class="file-list"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="assistant-status" id="assistantStatus">
                    <!-- Shows available assistants -->
                </div>
            </div>
        </div>

        <div class="main">
            <div class="topbar">
                <button id="toggleSidebar" class="icon-btn">☰</button>
                <span class="logo">⚡ CC-Web</span>
                
                <!-- Assistant Selector -->
                <div class="topbar-selector">
                    <label>Assistant:</label>
                    <select id="assistantSelector" class="topbar-select">
                        <!-- Populated dynamically -->
                    </select>
                    <button id="switchAssistantBtn" class="switch-btn" title="Switch Assistant (preserve context)" style="display:none;">🔄 Switch</button>
                </div>
                
                <!-- Model Selector -->
                <div class="topbar-selector">
                    <label>Model:</label>
                    <select id="modelSelector" class="topbar-select">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                
                <span id="statusDisplay" class="status-display"></span>
            </div>

            <div class="welcome-screen" id="welcomeScreen">
                <h1>⚡ CC-Web</h1>
                <p>AI Coding Assistant Hub</p>
                <div class="assistant-cards" id="assistantCards">
                    <!-- Populated dynamically -->
                </div>
                <ol>
                    <li>Select an <strong>AI Assistant</strong> above</li>
                    <li>Click <strong>+</strong> to create a new session</li>
                    <li>Start coding with your preferred AI!</li>
                </ol>
            </div>

            <div class="chat-container" id="chatContainer" style="display:none;">
                <div id="typingIndicator" class="typing-indicator" style="display:none;">
                    <span class="assistant-name"></span> Thinking...
                </div>
            </div>

            <div class="input-area" id="inputArea" style="display:none;">
                <div class="input-wrapper">
                    <textarea id="messageInput" placeholder="Message..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn">Send</button>
                    <button id="stopBtn" class="stop-btn" style="display:none;">⏹ Stop</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
