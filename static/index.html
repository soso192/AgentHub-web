<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CC-Web 是用于管理 AI 编程助手会话、文件和协作面板的本地工作台。">
    <meta name="theme-color" content="#f7f8fa">
    <title>CC-Web · AI 编程工作台</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="sidebar" aria-label="会话与文件">
            <div class="sidebar-header">
                <h2>会话</h2>
                <button id="newSessionBtn" type="button" title="新建会话" aria-label="新建会话">+</button>
            </div>
            <div id="newSessionForm" class="new-session-form" style="display:none;">
                <div class="form-group">
                    <label for="assistantSelectNew">助手</label>
                    <select id="assistantSelectNew" class="form-select">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="cwdInput">工作目录</label>
                    <input type="text" id="cwdInput" placeholder="例如：C:/Users/you/project">
                        <button type="button" class="patch-folder-pick" data-folder-pick="cwdInput" title="从本机选择目录">📁</button>
                </div>
                <div class="form-group">
                    <label for="modelSelectNew">模型</label>
                    <select id="modelSelectNew" class="form-select">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-buttons">
                    <button id="createSessionBtn">Create</button>
                    <button id="cancelSessionBtn">Cancel</button>
                </div>
            </div>
            <div id="sessionList" class="session-list"></div>

            <!-- File Browser -->
            <div id="fileBrowser" class="file-browser">
                <div id="fileBrowserResize" class="file-browser-resize"></div>
                <div class="file-browser-header">
                    <span class="file-browser-icon" onclick="toggleFileBrowser()">📁</span>
                    <span class="file-browser-title" onclick="toggleFileBrowser()">Files</span>
                    <span id="fileBrowserPath" class="file-browser-path" onclick="toggleFileBrowser()"></span>
                    <button id="refreshFilesBtn" class="file-refresh-btn" onclick="event.stopPropagation(); refreshFiles();" title="Refresh files">🔄</button>
                    <span id="fileBrowserToggle" class="file-browser-toggle" onclick="toggleFileBrowser()">▶</span>
                </div>
                <div id="fileBrowserContent" class="file-browser-content" style="display:none;">
                    <div id="fileList" class="file-list"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="assistant-status" id="assistantStatus">
                    <!-- Shows available assistants -->
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button id="toggleSidebar" class="icon-btn" type="button" aria-label="打开会话与文件">☰</button>
                <span class="logo">⚡ CC-Web</span>
                <nav class="app-mode-toggle" aria-label="应用模式">
                    <button class="mode-btn active" type="button" onclick="location.href='/chat.html'" aria-current="page">聊天</button>
                    <button class="mode-btn" type="button" onclick="location.href='/patches.html'">智能开发</button>
                </nav>

                <!-- Assistant Selector -->
                <div class="topbar-selector">
                    <label for="assistantSelector">助手</label>
                    <select id="assistantSelector" class="topbar-select">
                        <!-- Populated dynamically -->
                    </select>
                    <button id="switchAssistantBtn" class="switch-btn" title="Switch Assistant (preserve context)" style="display:none;">🔄 Switch</button>
                </div>
                
                <!-- Model Selector -->
                <div class="topbar-selector">
                    <label for="modelSelector">模型</label>
                    <select id="modelSelector" class="topbar-select">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                
                <span id="statusDisplay" class="status-display" role="status" aria-live="polite"></span>
                <button id="themeToggle" class="theme-btn" type="button" title="切换主题" aria-label="切换主题">🌙</button>
                
                <!-- Split View Controls -->
                <div class="split-view-controls">
                    <button id="toggleSplitView" class="icon-btn" type="button" title="切换分屏" aria-label="切换分屏">⊞</button>
                    <select id="splitLayoutSelect" class="topbar-select" aria-label="分屏布局" style="display:none; min-width: 80px;">
                        <option value="1x1">1×1</option>
                        <option value="2x1">2×1</option>
                        <option value="1x2">1×2</option>
                        <option value="2x2" selected>2×2</option>
                        <option value="3x2">3×2</option>
                        <option value="3x3">3×3</option>
                    </select>
                    <button id="addPanelBtn" class="icon-btn" type="button" title="添加面板" aria-label="添加面板" style="display:none;">+</button>
                    <button id="toggleSyncMode" class="sync-btn" type="button" title="切换同步模式" style="display:none;">🔗 同步</button>
                </div>
            </header>

            <div class="welcome-screen" id="welcomeScreen">
                <h1>⚡ CC-Web</h1>
                <p>用于组织 AI 编程会话、文件与协作面板的本地工作台。</p>
                <div class="assistant-cards" id="assistantCards">
                    <!-- Populated dynamically -->
                </div>
                <ol>
                    <li>选择一个 <strong>AI 助手</strong></li>
                    <li>点击 <strong>＋</strong> 创建会话</li>
                    <li>输入需求并开始编程协作</li>
                </ol>
            </div>

            <!-- Single View (default) -->
            <div class="single-view-container" id="singleViewContainer">
                <div class="chat-container" id="chatContainer" role="log" aria-live="polite" aria-relevant="additions text" style="display:none;">
                    <div id="typingIndicator" class="typing-indicator" role="status" aria-live="polite" style="display:none;">
                        <span class="assistant-name"></span> 正在思考…
                    </div>
                </div>

                <div id="nodeReadonlyBanner" class="claude-history-banner" style="display:none;">该会话由后台任务（智能开发 / 补丁适配）创建，只读查看</div>

                <div class="input-area" id="inputArea" style="display:none;">
                    <div class="input-wrapper">
                        <label class="sr-only" for="messageInput">消息内容</label>
                        <textarea id="messageInput" placeholder="输入消息，Enter 发送，Shift + Enter 换行" rows="1"></textarea>
                        <button id="sendBtn" class="send-btn" type="button">发送</button>
                        <button id="stopBtn" class="stop-btn" type="button" style="display:none;">⏹ 停止</button>
                    </div>
                </div>
            </div>

            <!-- Split View Container -->
            <div class="split-view-container" id="splitViewContainer" style="display:none;">
                <div class="split-grid" id="splitGrid"></div>
            </div>
        </main>
    </div>

    <div id="appNoticeModal" class="modal-overlay app-notice-overlay" role="alertdialog" aria-modal="true" aria-labelledby="appNoticeTitle" style="display:none;">
        <div class="modal app-notice-modal">
            <button id="appNoticeClose" class="patch-notice-close" type="button" aria-label="关闭">×</button>
            <div class="patch-notice-icon" aria-hidden="true">!</div>
            <h3 id="appNoticeTitle">操作提示</h3>
            <p id="appNoticeMessage"></p>
            <div class="modal-footer"><button id="appNoticeConfirm" class="btn-primary" type="button">我知道了</button></div>
        </div>
    </div>

    <div id="appConfirmModal" class="modal-overlay app-notice-overlay" role="alertdialog" aria-modal="true" aria-labelledby="appConfirmTitle" style="display:none;">
        <div class="modal app-notice-modal">
            <h3 id="appConfirmTitle">确认操作</h3>
            <p id="appConfirmMessage"></p>
            <div class="modal-footer"><button id="appConfirmCancel" class="btn-cancel" type="button">取消</button><button id="appConfirmAccept" class="btn-primary" type="button">确认</button></div>
        </div>
    </div>

    <!-- Add Panel Modal -->
    <div id="addPanelModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Panel</h3>
                <button class="modal-close" onclick="closeAddPanelModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Select Session</label>
                    <select id="panelSessionSelect" class="form-select">
                        <option value="new">+ New Session</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <select id="panelPositionSelect" class="form-select">
                        <option value="-1">Auto (next available)</option>
                    </select>
                </div>
                <div id="newSessionPanelFields">
                    <div class="form-group">
                        <label>Assistant</label>
                        <select id="panelAssistantSelect" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label>Working Directory</label>
                        <input type="text" id="panelCwdInput" placeholder="e.g., C:/Users/you/project">
                    </div>
                    <div class="form-group">
                        <label>Model</label>
                        <select id="panelModelSelect" class="form-select"></select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeAddPanelModal()">Cancel</button>
                <button class="btn-primary" onclick="confirmAddPanel()">Add Panel</button>
            </div>
        </div>
    </div>

    <script src="/folderpick.js"></script>
    <script src="/app.js"></script>
</body>
</html>
