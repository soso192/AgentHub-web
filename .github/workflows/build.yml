name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # 一个平台/版本失败不影响其它组合继续构建（跨平台问题更容易定位）
      fail-fast: false
      matrix:
        include:
          # ── 开发版（默认 feature）──
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            edition: dev
            features: ''
            artifact: cc-web.exe
            archive: cc-web-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            edition: dev
            features: ''
            artifact: cc-web
            archive: cc-web-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            edition: dev
            features: ''
            artifact: cc-web
            archive: cc-web-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            edition: dev
            features: ''
            artifact: cc-web
            archive: cc-web-macos-x64.tar.gz
          # ── 小白版（--features implCon）──
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            edition: implCon
            features: '--features implCon'
            artifact: cc-web-implCon.exe
            archive: cc-web-implCon-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            edition: implCon
            features: '--features implCon'
            artifact: cc-web-implCon
            archive: cc-web-implCon-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            edition: implCon
            features: '--features implCon'
            artifact: cc-web-implCon
            archive: cc-web-implCon-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            edition: implCon
            features: '--features implCon'
            artifact: cc-web-implCon
            archive: cc-web-implCon-macos-x64.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }}, ${{ matrix.edition }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      # cargo 产物固定叫 cc-web(.exe)：开发版不用改名，只有小白版需要改成 cc-web-implCon
      - name: Rename artifact (Unix)
        if: runner.os != 'Windows' && matrix.edition == 'implCon'
        run: cp "target/${{ matrix.target }}/release/cc-web" "target/${{ matrix.target }}/release/${{ matrix.artifact }}"

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows' && matrix.edition == 'implCon'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\cc-web.exe" "target\${{ matrix.target }}\release\${{ matrix.artifact }}"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          chmod +x ${{ matrix.artifact }}
          tar czf ../../../${{ matrix.archive }} ${{ matrix.artifact }}
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cc-web-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true