name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cc-web.exe
            archive: cc-web-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cc-web
            archive: cc-web-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cc-web
            archive: cc-web-macos-arm64.tar.gz
          - os: macos-13              # 修复：用 Intel runner
            target: x86_64-apple-darwin
            artifact: cc-web
            archive: cc-web-macos-x64.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.artifact }}
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cc-web-*        # 明确匹配，避免嵌套目录问题

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |                  # 修复：用多行字符串
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true